<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIME KEEPING CAMERA</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f3f4f6;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    video {
      width: 100%;
      border-radius: 12px;
      background: black;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background: #198754;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>📸 TIME KEEPING CAMERA</h2>

  <video id="video" autoplay playsinline></video>

  <button onclick="openCamera()">
    OPEN CAMERA
  </button>

  <button onclick="takePhoto()">
    TAKE SELFIE
  </button>

  <canvas id="canvas" style="display:none;"></canvas>

  <div id="status"></div>

</div>

<script>

let stream = null;

async function openCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    document.getElementById("video").srcObject = stream;

    document.getElementById("status").innerText =
      "Camera is ready.";

  } catch (error) {

    document.getElementById("status").innerText =
      "Camera permission denied or unavailable.";

    console.error(error);

  }

}


function takePhoto() {

  const video =
    document.getElementById("video");

  const canvas =
    document.getElementById("canvas");

  if (!video.videoWidth) {

    alert("Open the camera first.");

    return;
  }

  canvas.width =
    video.videoWidth;

  canvas.height =
    video.videoHeight;

  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    video,
    0,
    0,
    canvas.width,
    canvas.height
  );

  canvas.style.display = "block";

  document.getElementById("status").innerText =
    "Selfie captured successfully!";

}

</script>

</body>
</html>
